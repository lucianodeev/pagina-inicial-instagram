icon">🔎</span><span class="copy"><span class="title" data-i18n="findTitle">Encontrar um profissional</span><span class="desc" data-i18n="findDesc">Encontre profissionais cadastrados na Rede LDR.</span></span><span class="arrow">↗</span></a>\n<a class="card" href="https://painel.ldrrhestrategia.com/para-profissionais" target="_blank" rel="noopener"><span class="icon">🤝</span><span class="copy"><span class="title" data-i18n="networkTitle">Quero entrar para a Rede LDR</span><span class="desc" data-i18n="networkDesc">Conheça a estrutura, os benefícios e como participar como profissional.</span></span><span class="arrow">↗</span></a>\n<a class="card commercial" href="https://ldrrhestrategia.com/vendedor?lang=pt" target="_blank" rel="noopener" id="seller-link"><span class="icon">📈</span><span class="copy"><span class="title" data-i18n="sellerTitle">Quero fazer parte da área comercial</span><span class="desc" data-i18n="sellerDesc">Conheça a oportunidade comercial e veja como trabalhar com a LDR.</span></span><span class="arrow">↗</span></a>\n<a class="card" href="https://painel.ldrrhestrategia.com/" target="_blank" rel="noopener"><span class="icon">🌐</span><span class="copy"><span class="title" data-i18n="platformTitle">Acessar a Plataforma LDR</span><span class="desc" data-i18n="platformDesc">Entre nos painéis, produtos e serviços da plataforma.</span></span><span class="arrow">↗</span></a>\n'''
