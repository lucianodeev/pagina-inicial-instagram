name: Update client login card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update client access card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio/index.html')
          s=p.read_text()
          anchor='<a class="card featured" href="https://painel.ldrrhestrategia.com/profissional/luciano-rodrigues-almeida" target="_blank" rel="noopener"><span class="icon">✦</span><span class="copy"><span class="title" data-i18n="bookTitle">Agendar com Luciano Rodrigues</span><span class="desc" data-i18n="bookDesc">CEO • Psicanalista • Gestor de RH e Projetos — veja o perfil e agende seu atendimento.</span></span><span class="arrow">↗</span></a>'
          client='<a class="card client-login" href="https://painel.ldrrhestrategia.com/cliente/login" target="_blank" rel="noopener"><span class="icon">🔐</span><span class="copy"><span class="title" data-i18n="clientTitle">Acessar Plataforma LDR</span><span class="desc" data-i18n="clientDesc">Cliente — entre com sua conta Google e acesse seus serviços, produtos e agendamentos.</span></span><span class="arrow">↗</span></a>'
          if 'https://painel.ldrrhestrategia.com/cliente/login' not in s:
              s=s.replace(anchor, anchor+'\n'+client, 1)
          s=s.replace('.card.massage{background:', '.card.client-login{background:linear-gradient(135deg,#0f2747,#174a7a);border-color:#4e8ecb}.client-login .desc{color:#e8f3ff}.card.massage{background:', 1)
          repls={
            "bookDesc:'CEO • Psicanalista • Gestor de RH e Projetos — veja o perfil e agende seu atendimento.',":"bookDesc:'CEO • Psicanalista • Gestor de RH e Projetos — veja o perfil e agende seu atendimento.',clientTitle:'Acessar Plataforma LDR',clientDesc:'Cliente — entre com sua conta Google e acesse seus serviços, produtos e agendamentos.',",
            "bookDesc:'CEO • Psychanalyste • Gestion RH et Projets — découvrez mon profil et prenez rendez-vous.',":"bookDesc:'CEO • Psychanalyste • Gestion RH et Projets — découvrez mon profil et prenez rendez-vous.',clientTitle:'Accéder à la plateforme LDR',clientDesc:'Client — connectez-vous avec votre compte Google et accédez à vos services, produits et rendez-vous.',",
            "bookDesc:'CEO • Psychoanalyst • HR & Project Manager — view my profile and book your appointment.',":"bookDesc:'CEO • Psychoanalyst • HR & Project Manager — view my profile and book your appointment.',clientTitle:'Access the LDR Platform',clientDesc:'Client — sign in with your Google account to access your services, products and appointments.',",
            "bookDesc:'CEO • Psicoanalista • Gestor de RR. HH. y Proyectos — consulta mi perfil y agenda tu atención.',":"bookDesc:'CEO • Psicoanalista • Gestor de RR. HH. y Proyectos — consulta mi perfil y agenda tu atención.',clientTitle:'Acceder a la Plataforma LDR',clientDesc:'Cliente — entra con tu cuenta de Google y accede a tus servicios, productos y citas.',"
          }
          for a,b in repls.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bio/index.html
          git diff --cached --quiet || git commit -m "feat: add client Google login to bio"
          git push
