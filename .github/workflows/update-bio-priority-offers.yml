name: Update bio priority offers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bio-priority-offers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only bio hierarchy and copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio/index.html')
          s=p.read_text()

          old_css='.card.client-login{background:linear-gradient(135deg,#F97316,#EA580C,#DC2626);border-color:#ffffff38;color:#fff}.client-login .desc{color:#FFF7ED}.client-login .icon{background:#ffffff20}.client-login .arrow{color:#FFF7ED}.client-login .hotmart-badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff2f;color:#fff;font-size:10px;font-weight:900;letter-spacing:.04em}.client-login .hotmart-price{display:block;margin-top:6px;color:#fff;font-size:12px;font-weight:900;line-height:1.45}'
          new_css='.card.training-offer{background:linear-gradient(135deg,#F97316,#EA580C,#DC2626);border-color:#ffffff38;color:#fff}.training-offer .desc{color:#FFF7ED}.training-offer .icon{background:#ffffff20}.training-offer .arrow{color:#FFF7ED}.offer-meta{display:block;margin-top:5px;color:#fff;font-size:12px;font-weight:900}.offer-cta{display:inline-block;margin-top:9px;padding:7px 10px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff32;color:#fff;font-size:10px;font-weight:900;letter-spacing:.05em}.massage .offer-cta{color:#fff}'
          s=s.replace(old_css,new_css,1)

