          new_about='''<section class="section about">\n<div class="section-kicker" data-i18n="aboutKicker">COMECE POR AQUI</div>\n<h2 data-i18n="aboutTitle">Escolha o que você procura hoje</h2>\n<p data-i18n="aboutText">Formação para crescer no negócio ou massagem para seu bem-estar em Bruxelas.</p>\n</section>'''
