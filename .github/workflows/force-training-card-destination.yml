name: Force training card destination

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-training-card-destination.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force only training card destination
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio/index.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="card training-offer" id="training-primary-link" href="https://painel.ldrrhestrategia.com/" target="_blank" rel="noopener">'
          new='<a class="card training-offer" id="training-primary-link" href="https://painel.ldrrhestrategia.com/" target="_blank" rel="noopener" onclick="this.href=\'https://painel.ldrrhestrategia.com/\'">'
          if old not in s:
              raise SystemExit('Training card anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bio/index.html
          git diff --cached --quiet || git commit -m "fix: force training bio card to LDR platform"
          git push
