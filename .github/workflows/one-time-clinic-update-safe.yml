name: One-time safe Luciano Conecta clinic update
on:
  push:
    paths:
      - '.github/workflows/one-time-clinic-update-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only requested cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('bio/index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="section" aria-labelledby="assinaturas">')
          end=s.index('</section>',start)+len('</section>')
          sec=s[start:end]
          newspaper=re.compile(r'\n?<a class="sale-card newspaper".*?</a>\n?',re.S)
          magazine=re.compile(r'\n?<a class="sale-card magazine".*?</a>\n?',re.S)
          clinic=re.compile(r'\n?<a class="sale-card clinic".*?</a>\n?',re.S)
          assert len(newspaper.findall(sec))==1
          assert len(magazine.findall(sec))==1
          assert len(clinic.findall(sec))==1
          c=clinic.search(sec).group(0).strip()
          c=c.replace('href="https://learn.lucianoconecta.online/clinica-social"','href="https://clinicasocial.ldrrhestrategia.com/"')
          sec=newspaper.sub('\n',sec,1)
          sec=magazine.sub('\n',sec,1)
          sec=clinic.sub('\n',sec,1)
          marker='<div class="sales-grid">'
          assert sec.count(marker)==1
          sec=sec.replace(marker,marker+'\n\n'+c,1)
          # Remove only the now-obsolete note that explicitly refers to Jornal/Revista.
          sec=re.sub(r'\n?<p class="independent" data-i18n="independentNote">Biblioteca LDR, Jornal LDR e Revista LDR possuem assinaturas independentes\. A contratação de uma não libera automaticamente as outras\.</p>\n?','\n',sec,count=1)
          s2=s[:start]+sec+s[end:]
          assert 'sale-card newspaper' not in sec and 'sale-card magazine' not in sec
          assert sec.count('sale-card clinic')==1
          assert 'https://clinicasocial.ldrrhestrategia.com/' in sec
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Guard unrelated production configuration
        run: |
          git diff -- bio/index.html
          test "$(git diff --name-only | tr -d '\r')" = "bio/index.html"
          git diff --exit-code -- CNAME index.html .github/workflows/pages.yml || exit 1
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-time-clinic-update-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bio/index.html .github/workflows/one-time-clinic-update-safe.yml
          git commit -m "fix(bio): update only Clínica Social access cards"
          git push origin main
