name: Update Hotmart client card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-hotmart-client-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only client platform card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bio/index.html')
          s=p.read_text()

          # Visual: only the client login card gets the Hotmart-like palette.
          old_css='.card.client-login{background:linear-gradient(135deg,#5A0015,#33000C);border-color:#D9B15F;color:#fff}.client-login .desc{color:#F5E9D4}.client-login .icon{background:#ffffff18}.client-login .arrow{color:#D9B15F}'
          new_css='.card.client-login{background:linear-gradient(135deg,#F97316,#EA580C,#DC2626);border-color:#ffffff38;color:#fff}.client-login .desc{color:#FFF7ED}.client-login .icon{background:#ffffff20}.client-login .arrow{color:#FFF7ED}.client-login .hotmart-badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff2f;color:#fff;font-size:10px;font-weight:900;letter-spacing:.04em}.client-login .hotmart-price{display:block;margin-top:6px;color:#fff;font-size:12px;font-weight:900;line-height:1.45}'
          s=s.replace(old_css,new_css,1)

          old_card='<a class="card client-login" href="https://painel.ldrrhestrategia.com/cliente/login" target="_blank" rel="noopener"><span class="icon">🔐</span><span class="copy"><span class="title" data-i18n="clientTitle">Acessar Plataforma LDR</span><span class="desc" data-i18n="clientDesc">Cliente — entre com sua conta Google e acesse seus serviços, produtos e agendamentos.</span></span><span class="arrow">↗</span></a>'
          new_card='<a class="card client-login" href="https://painel.ldrrhestrategia.com/cliente/login" target="_blank" rel="noopener"><span class="icon">🔐</span><span class="copy"><span class="title" data-i18n="clientTitle">Plataforma LDR</span><span class="desc" data-i18n="clientDesc">Entre com Google ou garanta seu acesso pela Hotmart.</span><span class="hotmart-badge" data-i18n="clientBadge">Também pela Hotmart</span><span class="hotmart-price" data-i18n="clientPrice">🇧🇷 12x R$ 31,03 • 🇪🇺 € 65,34</span></span><span class="arrow">↗</span></a>'
          s=s.replace(old_card,new_card,1)

          repl={
            "clientTitle:'Acessar Plataforma LDR',clientDesc:'Cliente — entre com sua conta Google e acesse seus serviços, produtos e agendamentos.'":"clientTitle:'Plataforma LDR',clientDesc:'Entre com Google ou garanta seu acesso pela Hotmart.',clientBadge:'Também pela Hotmart',clientPrice:'🇧🇷 12x R$ 31,03 • 🇪🇺 € 65,34'",
            "bookDesc:'CEO • Psychanalyste • RH & Gestion de projets — découvrez le profil et réservez votre rendez-vous.',massageTitle":"bookDesc:'CEO • Psychanalyste • RH & Gestion de projets — découvrez le profil et réservez votre rendez-vous.',clientTitle:'Plateforme LDR',clientDesc:'Connectez-vous avec Google ou obtenez votre accès via Hotmart.',clientBadge:'Également via Hotmart',clientPrice:'🇧🇷 12x R$ 31,03 • 🇪🇺 65,34 €',massageTitle",
            "bookDesc:'CEO • Psychoanalyst • HR & Project Manager — view the profile and book your appointment.',massageTitle":"bookDesc:'CEO • Psychoanalyst • HR & Project Manager — view the profile and book your appointment.',clientTitle:'LDR Platform',clientDesc:'Sign in with Google or get access through Hotmart.',clientBadge:'Also available via Hotmart',clientPrice:'🇧🇷 12x R$ 31.03 • 🇪🇺 €65.34',massageTitle",
            "bookDesc:'CEO • Psicoanalista • RR. HH. y Gestión de Proyectos — consulta el perfil y agenda tu atención.',massageTitle":"bookDesc:'CEO • Psicoanalista • RR. HH. y Gestión de Proyectos — consulta el perfil y agenda tu atención.',clientTitle:'Plataforma LDR',clientDesc:'Entra con Google o consigue tu acceso por Hotmart.',clientBadge:'También por Hotmart',clientPrice:'🇧🇷 12x R$ 31,03 • 🇪🇺 € 65,34',massageTitle"
          }
          for a,b in repl.items():
              s=s.replace(a,b,1)

          p.write_text(s)
          PY
      - name: Commit bio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bio/index.html
          git diff --cached --quiet || git commit -m "feat: add Hotmart pricing to client bio card"
          git push
