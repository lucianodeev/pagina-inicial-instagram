            "aboutKicker:'Sobre mim',aboutTitle:'Estratégia para pessoas, carreira e negócios',aboutText:'Minha atuação conecta Psicanálise, Recursos Humanos, gestão de projetos, carreira internacional, mentoria e empreendedorismo. À frente do ecossistema LDR, desenvolvo soluções para quem busca evolução profissional, apoio, oportunidades e crescimento sustentável.'":"aboutKicker:'COMECE POR AQUI',aboutTitle:'Escolha o que você procura hoje',aboutText:'Formação para crescer no negócio ou massagem para seu bem-estar em Bruxelas.'",
            "clientTitle:'Plataforma LDR',clientDesc:'Entre com Google ou garanta seu acesso pela Hotmart.',clientBadge:'Também pela Hotmart',clientPrice:'🇧🇷 12x R$ 31,03 • 🇪🇺 € 65,34',massageTitle:'Massagens na Bélgica — Agende aqui',massageDesc:'Atendimento presencial na Bélgica. Consulte horários e disponibilidade pelo WhatsApp.'":"trainingOfferTitle:'Formação para Empreendedores',trainingOfferMeta:'90 aulas + 6 encontros ao vivo',trainingOfferDesc:'Comece agora e avance com direção e estratégia.',trainingOfferCta:'CONHECER A FORMAÇÃO',massageTitle:'Massagens em Bruxelas',massageDesc:'Atendimento masculino em Schaerbeek. Consulte horários e agende pelo WhatsApp.',massageCta:'AGENDAR MASSAGEM'",
            "aboutKicker:'À propos',aboutTitle:'Stratégie pour les personnes, la carrière et les entreprises',aboutText:'Mon activité relie la psychanalyse, les ressources humaines, la gestion de projets, la carrière internationale, le mentorat et l’entrepreneuriat. À travers l’écosystème LDR, je développe des solutions pour celles et ceux qui recherchent évolution, soutien et opportunités.'":"aboutKicker:'COMMENCEZ ICI',aboutTitle:'Choisissez ce que vous recherchez aujourd’hui',aboutText:'Une formation pour développer votre activité ou un massage pour votre bien-être à Bruxelles.'",
            "clientTitle:'Accéder à la plateforme LDR',clientDesc:'Client — connectez-vous avec votre compte Google et accédez à vos services, produits et rendez-vous.',massageTitle:'Massages en Belgique — Réservez ici',massageDesc:'Service en présentiel en Belgique. Consultez les horaires et disponibilités via WhatsApp.'":"trainingOfferTitle:'Formation pour entrepreneurs',trainingOfferMeta:'90 cours + 6 rencontres en direct',trainingOfferDesc:'Commencez maintenant et avancez avec direction et stratégie.',trainingOfferCta:'DÉCOUVRIR LA FORMATION',massageTitle:'Massages à Bruxelles',massageDesc:'Service masculin à Schaerbeek. Consultez les horaires et réservez via WhatsApp.',massageCta:'RÉSERVER UN MASSAGE'",
            "aboutKicker:'About me',aboutTitle:'Strategy for people, careers and business',aboutText:'My work connects psychoanalysis, Human Resources, project management, international careers, mentoring and entrepreneurship. Through the LDR ecosystem, I develop solutions for people seeking growth, support and opportunities.'":"aboutKicker:'START HERE',aboutTitle:'Choose what you need today',aboutText:'Training to grow your business or a massage for your well-being in Brussels.'",
            "clientTitle:'Access the LDR Platform',clientDesc:'Client — sign in with your Google account to access your services, products and appointments.',massageTitle:'Massages in Belgium — Book here',massageDesc:'In-person service in Belgium. Check times and availability on WhatsApp.'":"trainingOfferTitle:'Entrepreneur Training',trainingOfferMeta:'90 lessons + 6 live sessions',trainingOfferDesc:'Start now and move forward with direction and strategy.',trainingOfferCta:'DISCOVER THE TRAINING',massageTitle:'Massages in Brussels',massageDesc:'Male massage service in Schaerbeek. Check availability and book on WhatsApp.',massageCta:'BOOK A MASSAGE'",
            "aboutKicker:'Sobre mí',aboutTitle:'Estrategia para personas, carrera y negocios',aboutText:'Mi trabajo conecta Psicoanálisis, Recursos Humanos, gestión de proyectos, carrera internacional, mentoría y emprendimiento. A través del ecosistema LDR, desarrollo soluciones para quienes buscan crecimiento, apoyo y oportunidades.'":"aboutKicker:'EMPIEZA AQUÍ',aboutTitle:'Elige lo que buscas hoy',aboutText:'Formación para hacer crecer tu negocio o masaje para tu bienestar en Bruselas.'",
            "clientTitle:'Acceder a la Plataforma LDR',clientDesc:'Cliente — entra con tu cuenta de Google y accede a tus servicios, productos y citas.',massageTitle:'Masajes en Bélgica — Agenda aquí',massageDesc:'Atención presencial en Bélgica. Consulta horarios y disponibilidad por WhatsApp.'":"trainingOfferTitle:'Formación para Emprendedores',trainingOfferMeta:'90 clases + 6 encuentros en vivo',trainingOfferDesc:'Empieza ahora y avanza con dirección y estrategia.',trainingOfferCta:'CONOCER LA FORMACIÓN',massageTitle:'Masajes en Bruselas',massageDesc:'Atención masculina en Schaerbeek. Consulta horarios y agenda por WhatsApp.',massageCta:'AGENDAR MASAJE'"
          }
          for a,b in repl.items():
              s=s.replace(a,b,1)

          old="document.getElementById('training-link').href='https://ldrrhestrategia.com/treinamento?lang='+siteLang;"
          new="document.getElementById('training-primary-link').href='https://ldrrhestrategia.com/treinamento?lang='+siteLang;document.getElementById('training-link').href='https://ldrrhestrategia.com/treinamento?lang='+siteLang;"
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit bio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bio/index.html
          git diff --cached --quiet || git commit -m "feat: prioritize training and Brussels massage on bio"
          git push
